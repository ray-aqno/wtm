[package]
name = "wtm"
version = "0.1.0"
edition = "2021"
description = "Persistent TUI for git worktree management in tandem with AI agents"
license = "MIT"

[[bin]]
name = "wtm"
path = "src/main.rs"

[lib]
name = "wtm"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
notify = "7"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
